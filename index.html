<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anti-Valentine 💔</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>💔 ANTI-VALENTINE ZONE 💔</h1>
<p class="subtitle">Love is overrated. Wi-Fi is forever.</p>

<button onclick="toggleHearts()">💥 Break the Hearts</button>
<button onclick="playMusic()">🎶 Play Emotional Damage</button>

<section class="card">
  <h2>🔥 Rage Click Counter</h2>
  <button onclick="rage()">CLICK WHEN ANGRY</button>
  <p>Rage level: <span id="rageCount">0</span></p>
</section>

<section class="card">
  <h2>📊 How Single Are You?</h2>
  <button onclick="singleTest()">Check Now</button>
  <p id="singleResult"></p>
</section>

<section class="card">
  <h2>🤖 Anti-Valentine Bot</h2>
  <input id="userInput" placeholder="Say something romantic 🤡">
  <button onclick="chat()">Send</button>
  <p id="botReply"></p>
</section>

<section class="card">
  <h2>💔 Breakup Letter Generator</h2>
  <button onclick="breakup()">Generate Letter</button>
  <p id="letter"></p>
</section>

<section class="card">
  <h2>😂 Random Anti-Love Joke</h2>
  <button onclick="joke()">Make Me Laugh</button>
  <p id="jokeText"></p>
</section>

<footer>
  Made with 💀 instead of ❤️
</footer>

<script src="script.js"></script>
</body>
</html>
