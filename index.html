<!DOCTYPE html>
<html>
<head>

<title>Valentine Destroyed</title>

<style>
body{margin:0;background:#000;color:#fff;text-align:center;font-family:Arial}

button{padding:12px 25px;border:none;border-radius:20px;background:crimson;color:white;font-size:1rem;margin:10px}

<body>

  </button>

<div class="card">

</div>

<script>
let x=0;
function r(){
  x++;
  document.getElementById('r').innerText=x;
  if(x===5) alert('🔥 Calm down. Eat snacks.');
}
</script>
